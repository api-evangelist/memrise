aid: memrise
name: memrise
description: >-
  Memrise is a language-learning app founded in 2010 and headquartered in London, UK,
  trusted by 80 million learners across iOS, Android, and web. It is built around real
  native-speaker video, goal-based specialised courses (exams, work, relationships,
  travel), a spaced-repetition memory-science engine created by co-founder and Princeton
  neuroscientist Greg Detre, and AI conversation practice. Memrise offers courses in
  149+ languages and has been profitable since 2016. It was surfaced as a portfolio
  company of Balderton Capital and Techstars and added to the API Evangelist network.
  Memrise is a consumer product and publishes no public developer API; this profile
  captures its public web, security, and machine-readable (llms.txt) surface.
